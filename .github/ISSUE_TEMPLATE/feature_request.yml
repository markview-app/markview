name: Feature Request
description: Suggest an improvement to the open-source edition
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please note the scope first: this edition is kept to a small, stable core, and
        new features beyond core markdown rendering are usually declined. Improvements to rendering correctness,
        accessibility and translations are the most likely to be accepted. See
        [Contributing](https://github.com/markview-app/markview/blob/main/docs/CONTRIBUTING.md#what-fits).

  - type: textarea
    id: feature
    attributes:
      label: What feature would you like to see?
      description: Describe your idea clearly
      placeholder: I would like MarkView to...
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this needed?
      description: Explain the use case or problem this solves
      placeholder: This would help when...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other details, examples, or screenshots
      placeholder: Optional - Add mockups, examples, or links to similar features
